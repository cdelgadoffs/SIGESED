<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boleta Profesional - ICOM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #e9edf2;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 30px 35px 35px 35px;
        }
        #configuracion {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 30px;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 30px;
        }
        .buscador {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .buscador label {
            font-weight: 600;
            color: #1a237e;
            font-size: 15px;
        }
        .buscador input {
            flex: 1;
            min-width: 220px;
            padding: 10px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #fafbfc;
            transition: 0.2s;
        }
        .buscador input:focus {
            border-color: #1a237e;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.12);
        }
        .buscador .alumno-seleccionado {
            font-size: 14px;
            background: #1a237e;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn-agregar {
            background: #0b6e4f;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-agregar:hover {
            background: #08523b;
        }
        .materias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px 18px;
            background: #f8fafc;
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .materia-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 6px 14px 6px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: 0.15s;
        }
        .materia-item:hover {
            border-color: #94a3b8;
        }
        .materia-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a237e;
            cursor: pointer;
            flex-shrink: 0;
        }
        .materia-item .materia-nombre {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
        }
        .materia-item input[type="number"] {
            width: 68px;
            padding: 6px 4px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            transition: 0.2s;
            background: white;
        }
        .materia-item input[type="number"]:focus {
            border-color: #1a237e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.10);
        }
        .materia-item input[type="number"]:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }
        .acciones {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .btn {
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primario {
            background: #1a237e;
            color: white;
        }
        .btn-primario:hover {
            background: #0d1445;
        }
        .btn-secundario {
            background: #e9edf4;
            color: #1e293b;
        }
        .btn-secundario:hover {
            background: #d0d7e2;
        }
        .btn-verde {
            background: #0b6e4f;
            color: white;
        }
        .btn-verde:hover {
            background: #08523b;
        }
        #boleta {
            font-family: 'Times New Roman', Times, serif;
            background: #ffffff;
            padding: 45px 50px 40px 50px;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            margin-top: 6px;
            transition: 0.2s;
        }
        #boleta .header-logos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        #boleta .header-logos img {
            height: 85px;
            width: 85px;
            object-fit: contain;
            flex-shrink: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        #boleta .header-logos .header-texto {
            flex: 1;
        }
        #boleta .lema {
            margin-top: 70px;
            text-align: center;
            font-style: italic;
            color: #6b7280;
            font-size: 15px;
        }
        #boleta .header {
            text-align: center;
            border-bottom: 3px double #1a1a1a;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        #boleta .header h1 {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            color: #000000;
            margin: 0;
            text-transform: uppercase;
        }
        #boleta .header h2 {
            font-size: 17px;
            font-weight: 400;
            color: #1e1e1e;
            margin: 2px 0 6px 0;
            letter-spacing: 1px;
        }
        #boleta .header .titulo-boleta {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #0b1a3a;
            margin-top: 6px;
        }
        #boleta .header .periodo {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            border-top: 1px solid #aaa;
            display: inline-block;
            padding-top: 6px;
            padding-left: 20px;
            padding-right: 20px;
            margin-top: 4px;
        }
        #boleta .alumno-nombre {
            font-size: 19px;
            font-weight: 600;
            padding: 14px 20px;
            background: #f5f7fa;
            border: 1px solid #b0b8c4;
            border-radius: 4px;
            margin-bottom: 22px;
            color: #0b1a3a;
        }
        #boleta .alumno-nombre span {
            font-weight: 400;
            color: #000;
        }
        #boleta table {
            width: 100%;
            border-collapse: collapse;
            margin: 6px 0 18px 0;
            font-size: 16px;
        }
        #boleta table th {
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #eef2f6;
            color: #1a1a1a;
            border-bottom: 2px solid #000000;
            padding: 10px 10px;
            font-weight: 700;
        }
        #boleta table td {
            padding: 10px 10px;
            border-bottom: 1px solid #d8dde5;
        }
        #boleta table tr:last-child td {
            border-bottom: none;
        }
        #boleta table td:last-child {
            text-align: center;
            font-weight: 700;
            font-size: 17px;
        }
        #boleta .promedio {
            background: #f4f7fc;
            padding: 14px 20px;
            border-radius: 4px;
            border: 1px solid #b0b8c4;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 19px;
            font-weight: 700;
        }
        #boleta .promedio .valor {
            color: #0b1a3a;
            font-size: 22px;
            background: white;
            padding: 2px 20px;
            border-radius: 4px;
            border: 1px solid #a0aaba;
        }
        #boleta .obs {
            margin-top: 52px;
            padding-top: 14px;
            border-top: 1px solid #b0b8c4;
        }
        #boleta .obs label {
            font-weight: 700;
            font-size: 15px;
            color: #1a1a1a;
        }
        #boleta .obs .linea {
            border-bottom: 1px solid #000000;
            width: 100%;
            height: 32px;
            margin-top: 2px;
        }
        #boleta .obs .obs-texto {
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.6;
            margin-top: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #000000;
        }
        #observacionesInput {
            width: 100%;
            min-height: 70px;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fafbfc;
            resize: vertical;
        }
        #observacionesInput:focus {
            border-color: #1a237e;
            outline: none;
            background: #fff;
        }
        #observacionesInput:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }
        #boleta .firma-sello {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 120px;
            padding-top: 0px;
        }
        #boleta .firma-sello .col {
            text-align: center;
            width: 45%;
        }
        #boleta .firma-sello .col .linea-firma {
            border-bottom: 1px solid #000000;
            height: 32px;
            margin-bottom: 2px;
        }
        #boleta .firma-sello .col .etiqueta {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a1a1a;
        }
        #boleta .firma-sello .col .sub {
            font-size: 13px;
            font-weight: 500;
            color: #000;
            margin-top: 2px;
            text-transform: uppercase;
        }
        #boleta .sin-materias {
            text-align: center;
            color: #475569;
            font-size: 17px;
            padding: 40px 0;
            font-family: 'Segoe UI', sans-serif;
        }
        @media print {
            #boleta .lema {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 8mm;
                margin: 0;
            }
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container {
                box-shadow: none !important;
                border-radius: 0 !important;
                padding: 10px !important;
                max-width: 100% !important;
            }
            #configuracion {
                display: none !important;
            }
            #boleta {
                border: none !important;
                border-radius: 0 !important;
                padding: 20px 30px !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
            #boleta .header {
                border-bottom: 3px double #000 !important;
            }
            #boleta table th {
                background: #eee !important;
                border-bottom: 2px solid #000 !important;
            }
            #boleta .promedio {
                border: 1px solid #000 !important;
                background: #f4f4f4 !important;
            }
            #boleta .firma-sello {
                margin-top: 120px !important;
                border-top: none !important;
            }
            #boleta .firma-sello .col .linea-firma {
                border-bottom: 1px solid #000 !important;
            }
            #boleta .obs .linea {
                border-bottom: 1px solid #000 !important;
            }
            .btn, .acciones {
                display: none !important;
            }
        }
        @media (max-width: 700px) {
            .container {
                padding: 12px;
            }
            .materias-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }
            .buscador {
                flex-direction: column;
                align-items: stretch;
            }
            .buscador input {
                min-width: unset;
            }
            .btn-agregar {
                width: 100%;
                text-align: center;
            }
            #boleta {
                padding: 18px 14px !important;
            }
            #boleta .header h1 {
                font-size: 20px;
            }
            #boleta .header .titulo-boleta {
                font-size: 16px;
                letter-spacing: 2px;
            }
            #boleta .firma-sello {
                flex-direction: column;
                align-items: center;
                gap: 30px;
                margin-top: 80px;
            }
            #boleta .firma-sello .col {
                width: 100%;
            }
            .acciones {
                justify-content: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div id="configuracion">

        <div class="buscador">
            <label for="alumnoInput">👩‍🎓 Alumna:</label>
            <input type="text" id="alumnoInput" list="alumnosList" placeholder="Escribe o selecciona..." autocomplete="off" />
            <datalist id="alumnosList"></datalist>
            <span class="alumno-seleccionado" id="alumnoSeleccionado">Ninguna</span>
            <button class="btn-agregar" onclick="seleccionarAlumna()">➕ Agregar / Seleccionar</button>
        </div>

        <div class="buscador">
            <label for="cicloInput">📅 Ciclo escolar:</label>
            <input type="text" id="cicloInput" placeholder="Ej. 2026-4" autocomplete="off" />
        </div>

        <div id="materiasContainer" class="materias-grid"></div>

        <div>
            <label for="observacionesInput" style="font-weight:600;color:#1a237e;font-size:15px;display:block;margin-bottom:8px;">📝 Observaciones de la alumna:</label>
            <textarea id="observacionesInput" placeholder="Selecciona una alumna para escribir sus observaciones..." disabled></textarea>
        </div>

        <div class="acciones">
            <button class="btn btn-secundario" onclick="limpiarTodo()">🗑️ Limpiar todo</button>
            <button class="btn btn-primario" onclick="actualizarBoleta()">📄 Actualizar boleta</button>
            <button class="btn btn-verde" onclick="imprimirBoleta()">🖨️ Imprimir / PDF</button>
        </div>
    </div>

    <div id="boleta">
        <div class="sin-materias">Selecciona o agrega una alumna y asigna materias para generar su boleta.</div>
    </div>

</div>

    let calificaciones = {};

    function escaparHTML(t) {
        return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function cargarObservaciones() {
        const obsInput = document.getElementById('observacionesInput');
        obsInput.disabled = !alumnaActual;
        obsInput.value = alumnaActual ? (observaciones[alumnaActual] || '') : '';
    }
    let alumnaActual = '';

    const alumnoInput = document.getElementById('alumnoInput');
    const datalist = document.getElementById('alumnosList');
    const alumnoSeleccionado = document.getElementById('alumnoSeleccionado');
    const materiasContainer = document.getElementById('materiasContainer');
    const boletaDiv = document.getElementById('boleta');

    function init() {
        document.getElementById('observacionesInput').addEventListener('input', function() {
            if (!alumnaActual) return;
            const t = this.value;
            if (t.trim()) observaciones[alumnaActual] = t; else delete observaciones[alumnaActual];
            try { localStorage.setItem('boletaObs', JSON.stringify(observaciones)); } catch (e) {}
            actualizarBoleta();
        });
        const cicloInput = document.getElementById('cicloInput');
        cicloInput.value = CICLO;
        cicloInput.addEventListener('input', function() {
            CICLO = this.value.trim();
            try { localStorage.setItem('boletaCiclo', CICLO); } catch (e) {}
            if (alumnaActual) actualizarBoleta();
        });

        ALUMNAS.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n;
            datalist.appendChild(opt);
        });

        materiasContainer.innerHTML = '';
        MATERIAS.forEach(materia => {
            const div = document.createElement('div');
            div.className = 'materia-item';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.dataset.materia = materia;

            const label = document.createElement('span');
            label.className = 'materia-nombre';
            label.textContent = materia;

            const input = document.createElement('input');
            input.type = 'number';
            input.min = 1;
            input.max = 10;
            input.step = 1;
            input.placeholder = '–';
            input.disabled = true;

            cb.addEventListener('change', function() {
                const materia = this.dataset.materia;
                const alumna = alumnaActual;
                if (!alumna) {
                    this.checked = false;
                    alert('Primero selecciona o agrega una alumna.');
                    return;
                }
                if (this.checked) {
                    input.disabled = false;
                    input.focus();
                    if (input.value === '') input.value = 10;
                } else {
                    input.disabled = true;
                    input.value = '';
                }
                guardarCalificacion(alumna, materia, input.value);
            });

            input.addEventListener('input', function() {
                const alumna = alumnaActual;
                if (!alumna) return;
                const materia = this.closest('.materia-item').querySelector('input[type="checkbox"]').dataset.materia;
                let val = this.value.trim();
                if (val === '') {
                    guardarCalificacion(alumna, materia, '');
                    return;
                }
                let num = Number(val);
                if (num < 1) num = 1;
                if (num > 10) num = 10;
                if (num !== Number(val)) this.value = num;
                guardarCalificacion(alumna, materia, String(num));
            });

            div.appendChild(cb);
            div.appendChild(label);
            div.appendChild(input);
            materiasContainer.appendChild(div);
        });

        alumnoInput.addEventListener('input', function() {
            const valor = this.value.trim();
            const encontrado = ALUMNAS.find(n => n.toLowerCase() === valor.toLowerCase());
            if (encontrado) {
                alumnaActual = encontrado;
                alumnoSeleccionado.textContent = encontrado;
                cargarDatosAlumna(encontrado);
                actualizarBoleta();
            } else {
                if (valor === '') {
                    alumnaActual = '';
                    alumnoSeleccionado.textContent = 'Ninguna';
                    limpiarControlesMaterias();
                    boletaDiv.innerHTML = `<div class="sin-materias">Selecciona o agrega una alumna para generar su boleta.</div>`;
                } else {
                    alumnoSeleccionado.textContent = `"${valor}" (presiona "Agregar")`;
                }
            }
        });

        alumnoInput.value = '';
        alumnoSeleccionado.textContent = 'Ninguna';
        limpiarControlesMaterias();
        boletaDiv.innerHTML = `<div class="sin-materias">Selecciona o agrega una alumna y asigna materias para generar su boleta.</div>`;
    }

    function seleccionarAlumna() {
        const valor = alumnoInput.value.trim();
        if (!valor) {
            alert('Escribe el nombre de la alumna en el campo de texto.');
            return;
        }
        alumnaActual = valor;
        alumnoSeleccionado.textContent = valor;
        if (!calificaciones[alumnaActual]) {
            calificaciones[alumnaActual] = {};
        }
        cargarDatosAlumna(alumnaActual);
        actualizarBoleta();
    }

    function guardarCalificacion(alumna, materia, valor) {
        if (!alumna) return;
        if (!calificaciones[alumna]) calificaciones[alumna] = {};
        if (valor === '' || valor === null || valor === undefined) {
            delete calificaciones[alumna][materia];
            if (Object.keys(calificaciones[alumna]).length === 0) delete calificaciones[alumna];
        } else {
            calificaciones[alumna][materia] = valor;
        }
        try { localStorage.setItem('boletaData', JSON.stringify(calificaciones)); } catch (e) {}
    }

    function cargarDatosAlumna(alumna) {
        cargarObservaciones();
        const items = materiasContainer.querySelectorAll('.materia-item');
        items.forEach(item => {
            const cb = item.querySelector('input[type="checkbox"]');
            const input = item.querySelector('input[type="number"]');
            const materia = cb.dataset.materia;
            cb.checked = false;
            input.disabled = true;
            input.value = '';
            if (calificaciones[alumna] && calificaciones[alumna][materia] !== undefined) {
                const val = calificaciones[alumna][materia];
                cb.checked = true;
                input.disabled = false;
                input.value = val;
            }
        });
    }

    function limpiarControlesMaterias() {
        cargarObservaciones();
        const items = materiasContainer.querySelectorAll('.materia-item');
        items.forEach(item => {
            item.querySelector('input[type="checkbox"]').checked = false;
            const input = item.querySelector('input[type="number"]');
            input.disabled = true;
            input.value = '';
        });
    }

    function limpiarTodo() {
        if (!confirm('¿Borrar todas las calificaciones ingresadas para TODAS las alumnas?')) return;
        calificaciones = {};
        observaciones = {};
        try { localStorage.removeItem('boletaObs'); } catch (e) {}
        try { localStorage.removeItem('boletaData'); } catch (e) {}
        if (alumnaActual) {
            cargarDatosAlumna(alumnaActual);
            actualizarBoleta();
        } else {
            limpiarControlesMaterias();
            boletaDiv.innerHTML = `<div class="sin-materias">Selecciona o agrega una alumna para generar su boleta.</div>`;
        }
    }

    function actualizarBoleta() {
        const alumna = alumnaActual;
        if (!alumna) {
            boletaDiv.innerHTML = `<div class="sin-materias">Selecciona o agrega una alumna para generar su boleta.</div>`;
            return;
        }

        const dataAlumna = calificaciones[alumna] || {};
        const materiasAsignadas = MATERIAS.filter(m => dataAlumna[m] !== undefined && dataAlumna[m] !== '');

        if (materiasAsignadas.length === 0) {
            boletaDiv.innerHTML = `
                <div class="sin-materias">
                    <strong>${alumna}</strong><br><br>
                    No tiene materias asignadas. Marca al menos una materia y asigna calificación.
                </div>
            `;
            return;
        }

        const obsTexto = (observaciones[alumna] || '').trim();
        let rows = '';
        let suma = 0;
        materiasAsignadas.forEach(materia => {
            const cal = dataAlumna[materia];
            const numCal = parseFloat(cal) || 0;
            suma += numCal;
            rows += `<tr><td>${materia}</td><td>${cal}</td></tr>`;
        });

        const promedio = (suma / materiasAsignadas.length).toFixed(2);

        const html = `
            <div class="header header-logos">
                <img src="${LOGO_ICOM}" alt="Logo ICOM" />
                <div class="header-texto">
                    <h1>Instituto Comercial México</h1>
                    <h2>Plantel Iztapalapa</h2>

                    <div class="periodo">Ciclo Escolar ${CICLO}</div>
                </div>
                <img src="${LOGO_55}" alt="Logo 55 aniversario" />
            </div>

            <div class="alumno-nombre">
                Alumno(a): <span>${alumna}</span>
            </div>

            <table>
                <thead>
                    <tr><th>Materia</th><th style="text-align:center;">Calificación</th></tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>

            <div class="promedio">
                <span>PROMEDIO GENERAL</span>
                <span class="valor">${promedio}</span>
            </div>

            <div class="obs">
                <label>Observaciones:</label>
                ${obsTexto ? `<div class="obs-texto">${escaparHTML(obsTexto)}</div>` : '<div class="linea"></div>'}
            </div>

            <div class="firma-sello">
                <div class="col">
                    <div class="linea-firma"></div>
                    <div class="etiqueta">Firma de conformidad</div>
                    <div class="sub">${alumna}</div>
                </div>
                <div class="col">
                    <div class="linea-firma"></div>
                    <div class="etiqueta">Sello de la Institución</div>
                    <div class="sub">Instituto Comercial México</div>
                </div>
            </div>

            <div class="lema">La enseñanza del presente para las generaciones del futuro</div>
        `;

        boletaDiv.innerHTML = html;
    }

    function imprimirBoleta() {
        if (!alumnaActual || !boletaDiv.querySelector('table')) {
            alert('Primero selecciona o agrega una alumna, asígnale materias y calificaciones.');
            return;
        }
        const tituloOriginal = document.title;
        document.title = `${alumnaActual} - ${CICLO}`;
        window.print();
        document.title = tituloOriginal;
    }

    function cargarPersistencia() {
        try {
            const raw = localStorage.getItem('boletaData');
            if (raw) calificaciones = JSON.parse(raw);
        } catch (e) {}
    }

    cargarPersistencia();
    init();
    console.log('✅ Boleta con 9 materias lista.');
</script>

</body>
</html>
